<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2340">
  <title>Offline — Garage Guys Field</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f2340;
      color: #f5f7fb;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0; opacity: 0.8; line-height: 1.45; max-width: 28rem; }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #0f2340;
      background: #f5a623;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Field needs a connection to load today’s jobs. Open again when signal returns — recently viewed Field pages may still be available from cache.</p>
    <a href="/field">Retry Field</a>
  </div>
</body>
</html>
